<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Design versions | Online GP Clinic</title>
  <link rel="stylesheet" href="../styles.css">
  <script src="versions.js" defer></script>
</head>
<body>
  <main style="max-width:1200px;margin:auto">
    <a href="../index.html">Return to module demo</a>
    <h1>Design versions</h1>
    <p>These are design explorations, not records of user testing.
      Revision 1 applies the supplied personas and classroom guidance.
      Revision 2 is the current working prototype.</p>
    <div class="two">
      <div class="field"><label for="module">Module</label>
        <select id="module"><option value="rx">Prescriptions</option>
          <option value="mc">Medical certificates</option></select></div>
      <div class="field"><label for="version">Version</label>
        <select id="version"><option value="0">Initial concept</option>
          <option value="1">Revision 1</option><option value="2">Revision 2</option>
          <option value="mobile">Revision 2 at 390px</option></select></div>
    </div>
    <section id="preview" aria-label="Selected prototype"></section>
  </main>
</body>
</html>
